name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # repo_token grants the scorecard-action enough scope to read
          # branch-protection rules (default GITHUB_TOKEN can't, which made
          # the Branch-Protection check error out with "Resource not
          # accessible by integration"). PAT is fine-grained, repo-scoped,
          # Administration: Read-only.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # publish_results=true publishes the score to the public
          # api.securityscorecards.dev API so the README badge can render it.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
