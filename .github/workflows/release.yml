name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release and upload artifacts"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# OSSF Token-Permissions: read-all top-level; the build job opts into the
# narrower contents: write + id-token: write that it actually needs.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build fat package in Docker
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/src" \
            -w /src \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            mcr.microsoft.com/dotnet/sdk:9.0@sha256:087fc98e5c6ffcea6c3e276c135c4a6717c589d9509a09cc22e7c634830a4db8 \
            bash -lc "chmod +x ./build.sh && ./build.sh fat"

      - name: Zip package
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Jellyfin.Plugin.TwoFactorAuth/Jellyfin.Plugin.TwoFactorAuth.csproj)"
          cd dist
          zip -r "Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip" "TwoFactorAuth"
          md5sum "Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip" | awk '{print toupper($1)}' > "Jellyfin.Plugin.TwoFactorAuthv${VERSION}.md5"
          sha256sum "Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip" > "Jellyfin.Plugin.TwoFactorAuthv${VERSION}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign binary to v2.4.0 — newer v3+ cosign defaults to
          # --new-bundle-format which silently ignores our --output-signature
          # and --output-certificate flags, breaking the .sig/.pem assets
          # Scorecard's Signed-Releases check looks for. v2.4.0 keeps the
          # legacy flag behavior. Revisit when we're ready to migrate to
          # cosign bundles + update the gh release upload list.
          cosign-release: 'v2.4.0'

      - name: Sign release zip
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Jellyfin.Plugin.TwoFactorAuth/Jellyfin.Plugin.TwoFactorAuth.csproj)"
          ZIP="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip"
          cosign sign-blob --yes --output-signature "${ZIP}.sig" --output-certificate "${ZIP}.pem" "$ZIP"

      # SLSA build provenance: GitHub's first-party attestation action signs an
      # in-toto attestation linking the zip to this exact workflow run + commit
      # SHA. Lifts OpenSSF Scorecard's Signed-Releases check from partial to
      # full credit and lets downstream consumers verify origin via
      # `gh attestation verify --owner ZL154 <zip>`.
      - name: Attest build provenance
        id: attest
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'dist/Jellyfin.Plugin.TwoFactorAuthv*.zip'

      # Scorecard's Signed-Releases check inspects release assets directly —
      # the attestation registry it can't see. Stage the bundle JSONL next
      # to the zip so the per-release asset list includes it.
      - name: Stage attestation as release asset
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Jellyfin.Plugin.TwoFactorAuth/Jellyfin.Plugin.TwoFactorAuth.csproj)"
          cp '${{ steps.attest.outputs.bundle-path }}' "dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jellyfin-security-fat-package
          path: |
            dist/Jellyfin.Plugin.TwoFactorAuthv*.zip
            dist/Jellyfin.Plugin.TwoFactorAuthv*.md5
            dist/Jellyfin.Plugin.TwoFactorAuthv*.sha256
            dist/Jellyfin.Plugin.TwoFactorAuthv*.sig
            dist/Jellyfin.Plugin.TwoFactorAuthv*.pem
            dist/Jellyfin.Plugin.TwoFactorAuthv*.intoto.jsonl

      - name: Create or update release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Jellyfin.Plugin.TwoFactorAuth/Jellyfin.Plugin.TwoFactorAuth.csproj)"
          # Derive the GitHub release tag from the assembly version.
          # Standard 4-part assembly versions end in .0 (e.g. 2.4.13.0 →
          # v2.4.13) so we strip a trailing .0 only. 4-part prereleases
          # with a non-zero build (e.g. 2.4.10.1, 2.4.12.1) must keep the
          # full version in the tag so the workflow uploads artifacts to
          # the right release — without this guard, v2.4.10.1's artifacts
          # uploaded to the v2.4.10 stable release and overwrote its body.
          TAG="v${VERSION%.0}"
          ZIP="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip"
          MD5="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.md5"
          SHA256="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.sha256"
          SIG="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip.sig"
          PEM="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip.pem"
          ATTESTATION="dist/Jellyfin.Plugin.TwoFactorAuthv${VERSION}.zip.intoto.jsonl"
          # Release body: prefer docs/release-notes/v<VERSION>.md, then docs/release-notes/<TAG>.md,
          # then fall back to the generic blurb. Lets each release ship a real
          # changelog without editing the workflow file.
          NOTES_FILE=""
          if [ -f "docs/release-notes/v${VERSION}.md" ]; then
            NOTES_FILE="docs/release-notes/v${VERSION}.md"
          elif [ -f "docs/release-notes/${TAG}.md" ]; then
            NOTES_FILE="docs/release-notes/${TAG}.md"
          fi
          # Decide whether the release already exists. Splitting this out
          # so we NEVER clobber a populated body.
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=1
          else
            RELEASE_EXISTS=0
          fi
          if [ -z "$NOTES_FILE" ]; then
            if [ "$RELEASE_EXISTS" = "1" ]; then
              # Re-run / backfill against an existing release with no notes
              # file at this tag — leave the existing body alone. Prior
              # behaviour overwrote rich release bodies with a generic
              # "Automated release..." placeholder when the workflow was
              # re-dispatched against older tags that pre-date the
              # docs/release-notes/ convention.
              echo "No release-notes file checked into this tag and the release already exists. Preserving the existing body."
            else
              echo "Automated release for Jellyfin Security ${VERSION}. Sigstore-signed zip - verify with cosign verify-blob." > "$RUNNER_TEMP/notes.md"
              NOTES_FILE="$RUNNER_TEMP/notes.md"
            fi
          fi
          if [ "$RELEASE_EXISTS" = "1" ]; then
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
          gh release upload "$TAG" "$ZIP" "$MD5" "$SHA256" "$SIG" "$PEM" "$ATTESTATION" --clobber
