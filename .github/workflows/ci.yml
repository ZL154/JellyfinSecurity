name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# OSSF Scorecard TokenPermissions: top-level read-all so the default token
# is least-privilege. Jobs may grant narrower per-job scopes if needed.
permissions: read-all

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        id: restore
        run: dotnet restore JellyfinSecurity.sln --locked-mode

      # NU1004 says "the lock file is inconsistent" but not which files to
      # regenerate, and the answer is rarely the project that was edited: a
      # bump in src/ invalidates the test and fuzz lock files too, because
      # both record src's packages as transitive through their
      # ProjectReference. Re-resolve and name the files, so the fix is one
      # copyable command rather than a reading exercise.
      - name: Explain lock file drift
        if: failure() && steps.restore.outcome == 'failure'
        run: |
          set -uo pipefail

          # Distinguish drift from a genuinely broken restore. If re-resolving
          # also fails, or succeeds without touching a lock file, then the
          # locked-mode failure was something else (unreachable feed, package
          # pulled from nuget.org, typo'd version) and claiming "drift" would
          # send the reader down the wrong path.
          if ! dotnet restore JellyfinSecurity.sln --force-evaluate; then
            echo "::error::Restore fails even with --force-evaluate, so this is not lock file drift. See the restore errors above."
            exit 1
          fi

          if git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::Locked-mode restore failed but re-resolving changed no lock file. See the restore errors above."
            exit 1
          fi

          echo "::group::Lock files that need regenerating"
          git --no-pager diff --stat -- '**/packages.lock.json'
          echo "::endgroup::"
          echo "::error::Lock files are out of sync. Run 'dotnet restore JellyfinSecurity.sln --force-evaluate' and commit every packages.lock.json it changes."
          exit 1

      - name: Build
        run: dotnet build JellyfinSecurity.sln --configuration Release --no-restore

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore JellyfinSecurity.sln --locked-mode

      - name: Test with coverage
        run: |
          dotnet test JellyfinSecurity.sln \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ./TestResults

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false
          verbose: true
