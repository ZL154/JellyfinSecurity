version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/Jellyfin.Plugin.TwoFactorAuth"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      microsoft-identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.*"
          - "IdentityModel.*"
      fido2:
        patterns:
          - "Fido2*"
    ignore:
      # Floating wildcards on the Jellyfin SDK are intentional — pin/upgrade via csproj.
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "nuget"
    directory: "/tests/Jellyfin.Plugin.TwoFactorAuth.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "deps(tests)"
    # This project references the plugin project, so this entry also sees the
    # plugin's packages and opens bumps against its csproj (#39 and #72 came
    # this way). The Jellyfin SDK stays pinned, as in the first entry.
    ignore:
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "nuget"
    directory: "/tests/Jellyfin.Plugin.TwoFactorAuth.Fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "fuzz"
    commit-message:
      prefix: "deps(fuzz)"
    # Same reason as the tests entry (#31, #59 and #87 came this way).
    ignore:
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "fuzz"
    commit-message:
      prefix: "deps(fuzz-docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # init, analyze and upload-sarif are three entry points of one versioned
      # bundle, pinned across codeql.yml and scorecard.yml. Bumped separately
      # they deadlock: init reads a config written by its own version and
      # analyze refuses it with "Loaded a configuration file for version X,
      # but running version Y" (that was PR #155). Keep them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
