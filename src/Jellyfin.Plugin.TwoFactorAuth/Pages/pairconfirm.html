<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="tfa.pairconfirm.page_title">Confirm Device Pairing</title>
    <script src="tfa-i18n"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
            color: #e0e0e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            padding: 32px 28px; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .icon { text-align: center; font-size: 44px; margin-bottom: 8px; }
        h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
        .device-card {
            background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 16px; margin-bottom: 20px;
        }
        .device-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .device-value { font-size: 14px; color: #e0e0e0; margin-bottom: 12px; }
        .device-value:last-child { margin-bottom: 0; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        .btn-primary { background: #00a4dc; color: #fff; margin-bottom: 10px; }
        .btn-primary:hover:not(:disabled) { background: #0087b3; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: #888; border: 1px solid #333; }
        .btn-ghost:hover { color: #ccc; border-color: #555; }
        .status {
            margin-top: 14px; padding: 12px; border-radius: 6px; font-size: 13px;
            text-align: center; display: none;
        }
        .status.show { display: block; }
        .status.success { background: rgba(76,175,80,0.1); color: #66bb6a; border: 1px solid rgba(76,175,80,0.2); }
        .status.error { background: rgba(244,67,54,0.1); color: #ef5350; border: 1px solid rgba(244,67,54,0.2); }
        .muted { color: #666; font-size: 12px; text-align: center; margin-top: 18px; }
        a { color: #00a4dc; text-decoration: none; }
        .tfa-lang-picker { background: rgba(255,255,255,0.04); color: #ccc; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
        .tfa-lang-picker:hover { background: rgba(255,255,255,0.08); }
        .tfa-lang-host { position: absolute; top: 16px; right: 16px; }
        .tfa-lang-picker-wrap { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 6px; cursor: pointer; }
        .tfa-lang-picker-wrap:hover { background: rgba(255,255,255,0.08); }
        .tfa-lang-picker-wrap .tfa-globe { font-size: 14px; line-height: 1; }
        .tfa-lang-picker-wrap select { background: transparent; color: #ddd; border: none; font-size: 12px; padding: 4px 2px; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; padding-right: 14px; min-width: 80px; max-width: 140px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .tfa-lang-picker-wrap select:focus { outline: none; }
        .tfa-lang-picker-wrap select option { background: #1a1a1a; color: #ddd; }
        .tfa-lang-picker-wrap select option:checked { background: #00a4dc; color: #fff; }
    </style>
</head>
<body>
    <div class="tfa-lang-host" id="tfaLangHost"></div>
    <div class="card">
        <div class="icon">🔐</div>
        <h1 data-i18n-key="tfa.pairconfirm.title">Confirm Device Pairing</h1>
        <p class="subtitle" data-i18n-key="tfa.pairconfirm.subtitle">You're about to trust this device to skip two-factor authentication on future sign-ins.</p>

        <div class="device-card" id="deviceCard" style="display:none;">
            <div class="device-label" data-i18n-key="tfa.pairconfirm.device_label">Device</div>
            <div class="device-value" id="deviceName">—</div>
            <div class="device-label" data-i18n-key="tfa.pairconfirm.app_label">App</div>
            <div class="device-value" id="appName">—</div>
        </div>

        <button class="btn-primary" id="btnConfirm" disabled data-i18n-key="tfa.pairconfirm.btn_trust">Trust This Device</button>
        <button class="btn-ghost" id="btnCancel" data-i18n-key="tfa.setup.btn_cancel">Cancel</button>

        <div class="status" id="statusBox"></div>
        <p class="muted" data-i18n-key="tfa.pairconfirm.warning">Only pair devices you recognize.</p>
    </div>

    <script>
        // v2.5.0: mount the shared language picker. tfa-i18n.js auto-loads
        // translations on DOMContentLoaded; we just need to render the picker
        // host. The setTimeout retry covers the race where the helper script
        // hasn't finished parsing yet on first call.
        function _initTfaLangPicker() {
            if (window.tfaI18n && window.tfaI18n.renderLanguagePicker) {
                var host = document.getElementById('tfaLangHost');
                if (host && !host.firstChild) {
                    window.tfaI18n.renderLanguagePicker(host);
                }
            } else {
                setTimeout(_initTfaLangPicker, 50);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _initTfaLangPicker);
        } else {
            _initTfaLangPicker();
        }

        // v2.5.0: small helper — translate with English fallback if the i18n
        // helper hasn't loaded yet (e.g. on slow first-paint or offline).
        function _tr(key, fallback) {
            return (window.tfaI18n && window.tfaI18n.tr) ? window.tfaI18n.tr(key, fallback) : fallback;
        }

        function getToken() {
            try {
                var c = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}');
                return (c.Servers && c.Servers[0] && c.Servers[0].AccessToken) || '';
            } catch (e) { return ''; }
        }
        function showStatus(msg, ok) {
            var el = document.getElementById('statusBox');
            el.className = 'status show ' + (ok ? 'success' : 'error');
            el.textContent = msg;
        }
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        // v2.5.0 i18n race fix: tfa-i18n.js is async-loaded, so window.tfaI18n
        // is undefined when this inline script runs. All of the initial-render
        // _tr() calls below (missing token, signin required, expired link,
        // app-name fallback, invalid token) would silently fall back to the
        // English literal. Defer the whole top-level render block until the
        // bundle is loaded; ternary keeps the page functional if the helper
        // script fails to load entirely.
        (window.tfaI18n && window.tfaI18n.ready ? window.tfaI18n.ready : Promise.resolve())
            .then(function() {
                if (!token) {
                    showStatus(_tr('tfa.pairconfirm.error_missing_token', 'Missing pairing token.'), false);
                } else if (!getToken()) {
                    showStatus(_tr('tfa.pairconfirm.error_signin_required', 'You need to sign in first. '), false);
                    document.getElementById('statusBox').innerHTML += '<a href="../web/index.html">' + _tr('tfa.pairconfirm.signin_link', 'Sign in →') + '</a>';
                } else {
                    // Decode token payload client-side (just for display — server re-verifies signature)
                    try {
                        var fixed = token.replace(/-/g, '+').replace(/_/g, '/');
                        while (fixed.length % 4) fixed += '=';
                        var decoded = atob(fixed);
                        var dotIdx = decoded.lastIndexOf('.');
                        var payload = decoded.substring(0, dotIdx);
                        var parts = payload.split('|');
                        var deviceId = parts[2];
                        var exp = parseInt(parts[3], 10);
                        if (Date.now() / 1000 > exp) {
                            showStatus(_tr('tfa.pairconfirm.error_expired', 'This pairing link has expired. Generate a new QR.'), false);
                        } else {
                            // We don't know the device name client-side — it's stored server-side
                            // in the pending pairing record. Show deviceId as fallback.
                            document.getElementById('deviceName').textContent = deviceId;
                            document.getElementById('appName').textContent = _tr('tfa.pairconfirm.app_pairing_server_side', 'Pairing server-side');
                            document.getElementById('deviceCard').style.display = 'block';
                            document.getElementById('btnConfirm').disabled = false;
                        }
                    } catch (e) { showStatus(_tr('tfa.pairconfirm.error_invalid_token', 'Invalid token.'), false); }
                }
            });

        document.getElementById('btnConfirm').addEventListener('click', function() {
            this.disabled = true;
            this.textContent = _tr('tfa.pairconfirm.btn_pairing', 'Pairing…');
            fetch(window.tfaUrl('TwoFactorAuth/PairConfirm'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Emby-Token': getToken() },
                body: JSON.stringify({ token: token })
            }).then(function(r) {
                return r.json().then(function(b) { return { ok: r.ok, body: b }; });
            }).then(function(r) {
                if (r.ok) {
                    var deviceLabel = r.body.deviceName || _tr('tfa.pairconfirm.fallback_device', 'the device');
                    showStatus('✓ ' + _tr('tfa.pairconfirm.success_prefix', 'Device paired. You can now sign in on') + ' ' + deviceLabel + '.', true);
                    document.getElementById('btnConfirm').style.display = 'none';
                    document.getElementById('btnCancel').textContent = _tr('tfa.pairconfirm.btn_done', 'Done');
                } else {
                    showStatus(r.body.message || _tr('tfa.pairconfirm.error_failed', 'Pairing failed.'), false);
                    document.getElementById('btnConfirm').disabled = false;
                    document.getElementById('btnConfirm').textContent = _tr('tfa.pairconfirm.btn_trust', 'Trust This Device');
                }
            }).catch(function() {
                showStatus(_tr('tfa.pairconfirm.error_network', 'Network error. Try again.'), false);
                document.getElementById('btnConfirm').disabled = false;
                document.getElementById('btnConfirm').textContent = _tr('tfa.pairconfirm.btn_trust', 'Trust This Device');
            });
        });

        document.getElementById('btnCancel').addEventListener('click', function() {
            window.location.href = window.tfaUrl('TwoFactorAuth/Setup');
        });
    </script>
</body>
</html>
