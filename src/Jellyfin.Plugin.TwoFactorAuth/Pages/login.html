<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="tfa.login.page_title">Jellyfin — Sign In</title>
    <script src="tfa-i18n"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
            color: #e0e0e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        @media (max-width: 500px) {
            .card { padding: 28px 22px; border-radius: 10px; }
        }
        .logo { text-align: center; color: #00a4dc; font-size: 28px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
        h1 { text-align: center; font-size: 14px; font-weight: 400; color: #888; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; color: #888; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%;
            background: #252525;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.15s;
            font-family: inherit;
        }
        input:focus { border-color: #00a4dc; outline: none; }
        .code-input { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 20px; text-align: center; letter-spacing: 6px; }
        .code-input.recovery { letter-spacing: 2px; font-size: 18px; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #00a4dc;
            color: #fff;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background: #0087b3; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            padding: 10px 12px;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }
        .alert.show { display: block; }
        .alert.error { color: #f44336; background: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.2); }
        .alert.info { color: #00a4dc; background: rgba(0,164,220,0.1); border: 1px solid rgba(0,164,220,0.2); }
        .toggle-link {
            display: block;
            text-align: center;
            color: #00a4dc;
            font-size: 12px;
            margin: -6px 0 14px;
            cursor: pointer;
            text-decoration: none;
        }
        .toggle-link:hover { text-decoration: underline; }
        .trust-row { display: flex; align-items: center; gap: 8px; color: #888; font-size: 12px; text-transform: none; letter-spacing: 0; margin: -2px 0 16px; }
        .trust-row input { width: auto; margin: 0; }
        .hint { color: #666; font-size: 12px; text-align: center; margin-top: 20px; line-height: 1.6; }
        .hint a { color: #00a4dc; text-decoration: none; }
        .hint a:hover { text-decoration: underline; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: -2px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tfa-lang-picker { background: rgba(255,255,255,0.04); color: #ccc; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
        .tfa-lang-picker:hover { background: rgba(255,255,255,0.08); }
        .tfa-lang-host { position: absolute; top: 16px; right: 16px; }
        .tfa-lang-picker-wrap { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 6px; cursor: pointer; }
        .tfa-lang-picker-wrap:hover { background: rgba(255,255,255,0.08); }
        .tfa-lang-picker-wrap .tfa-globe { font-size: 14px; line-height: 1; }
        .tfa-lang-picker-wrap select { background: transparent; color: #ddd; border: none; font-size: 12px; padding: 4px 2px; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; padding-right: 14px; min-width: 80px; max-width: 140px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .tfa-lang-picker-wrap select:focus { outline: none; }
        .tfa-lang-picker-wrap select option { background: #1a1a1a; color: #ddd; }
        .tfa-lang-picker-wrap select option:checked { background: #00a4dc; color: #fff; }
    </style>
</head>
<body>
    <div class="tfa-lang-host" id="tfaLangHost"></div>
    <div class="card">
        <div class="logo">Jellyfin</div>
        <h1 data-i18n-key="tfa.login.heading">Sign In</h1>

        <div class="alert error" id="errorMsg"></div>

        <label data-i18n-key="tfa.login.username_label">Username</label>
        <input type="text" id="username" autocomplete="username" />

        <label data-i18n-key="tfa.login.password_label">Password</label>
        <input type="password" id="password" autocomplete="current-password" />

        <label id="codeLabel"><span data-i18n-key="tfa.login.code_label_main">6-digit Code</span> <span style="color:#555;text-transform:none;" data-i18n-key="tfa.login.code_label_hint">(leave blank if 2FA isn't set up)</span></label>
        <input type="text" id="code" class="code-input" maxlength="8" inputmode="numeric" placeholder="000000" autocomplete="one-time-code" />

        <a class="toggle-link" id="toggleRecovery" data-i18n-key="tfa.challenge.recovery_label">Use a recovery code instead</a>

        <label class="trust-row">
            <input type="checkbox" id="trustDevice" />
            <span data-i18n-key="tfa.login.trust_device">Trust this device</span>
        </label>

        <button id="btnLogin" data-i18n-key="tfa.login.btn_signin">Sign In</button>

        <p class="hint">
            <span data-i18n-key="tfa.login.hint_no_2fa">Don't have 2FA yet?</span> <a href="Setup" data-i18n-key="tfa.login.hint_setup_link">Set it up here</a><br>
            <span data-i18n-key="tfa.login.hint_standard_prefix">Or use the</span> <a href="../web/index.html" data-i18n-key="tfa.login.hint_standard_link">standard login page</a>.
        </p>
    </div>

    <script>
        // v2.5.0: mount the shared language picker. tfa-i18n.js auto-loads
        // translations on DOMContentLoaded; we just need to render the picker
        // host. The setTimeout retry covers the race where the helper script
        // hasn't finished parsing yet on first call.
        function _initTfaLangPicker() {
            if (window.tfaI18n && window.tfaI18n.renderLanguagePicker) {
                var host = document.getElementById('tfaLangHost');
                if (host && !host.firstChild) {
                    window.tfaI18n.renderLanguagePicker(host);
                }
            } else {
                setTimeout(_initTfaLangPicker, 50);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _initTfaLangPicker);
        } else {
            _initTfaLangPicker();
        }

        // v2.5.0: small helper — translate with English fallback if the i18n
        // helper hasn't loaded yet (e.g. on slow first-paint or offline).
        function _tr(key, fallback) {
            return (window.tfaI18n && window.tfaI18n.tr) ? window.tfaI18n.tr(key, fallback) : fallback;
        }

        // [v2.5.21] (#137/#98) jellyfin-web's ConnectionMode enum
        // (src/lib/jellyfin-apiclient/connectionMode.ts): Local=0, Remote=1,
        // Manual=2. getOrCreateApiClient() resolves a server's address with
        // getServerAddress(server, server.LastConnectionMode) and does NOT fall
        // back — mode 1 reads server.RemoteAddress, which we never populate, so
        // the ApiClient came up with an undefined address and Jellyfin Web
        // bounced straight back to the login page. We only ever write
        // ManualAddress, so Manual is the correct mode; it is also what
        // Jellyfin's own addApiClient() stores.
        var TFA_CONNECTION_MODE_MANUAL = 2;

        // [v2.5.21] (#137/#98) Sign-in completed — tear down the client-side
        // 2FA-pending state before handing control back to Jellyfin Web.
        // inject.js arms sessionStorage['__tfa_pending'] the moment the server
        // answers a call with twoFactorRequired, then short-circuits every
        // non-auth fetch/XHR with a synthetic 403 for the next 5 minutes and
        // redirects to the 2FA portal. Our standalone pages don't load
        // inject.js, so nothing cleared that flag when the user actually
        // finished signing in here — landing on /web re-ran inject.js, found
        // the flag still armed, blocked the whole bootstrap and threw the user
        // back at the sign-in page. The OIDC bridge already did this
        // (v2.5.14, #98); the password+2FA paths never did (#137). A LAN
        // bypass means the flag is never armed internally, which is exactly
        // why this only reproduced from outside the network.
        // Deliberately does NOT touch localStorage['__tfa_set_pw_required'] —
        // that flag belongs to the OIDC force-password-onboarding step (#100)
        // and is cleared only by the set-password page once the password is
        // actually set.
        function clearTfaClientState() {
            try { sessionStorage.removeItem('__tfa_pending'); } catch (e) {}
            // [#134] This browser just signed in locally, so any RP-logout
            // marker still sitting here belongs to an older OIDC session.
            // Leaving it armed would send a password sign-out to that IdP.
            try { localStorage.removeItem('__tfa_rp_logout'); } catch (e) {}
        }

        var params = new URLSearchParams(window.location.search);
        var prefillUsername = params.get('username');
        var usingRecovery = false;
        var lockoutTimer = null;

        if (prefillUsername) {
            document.getElementById('username').value = prefillUsername;
            setTimeout(function() { document.getElementById('password').focus(); }, 50);
        } else {
            document.getElementById('username').focus();
        }

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }
        function clearError() { document.getElementById('errorMsg').classList.remove('show'); }

        function setRecoveryMode(on) {
            usingRecovery = on;
            var input = document.getElementById('code');
            var label = document.getElementById('codeLabel');
            var toggle = document.getElementById('toggleRecovery');
            if (on) {
                input.classList.add('recovery');
                input.setAttribute('maxlength', '14');
                input.setAttribute('placeholder', 'XXXXX-XXXXX');
                input.setAttribute('autocomplete', 'off');
                label.innerHTML = _tr('tfa.login.recovery_label_main', 'Recovery code') + ' <span style="color:#555;text-transform:none;">' + _tr('tfa.login.recovery_label_hint', '(format: XXXXX-XXXXX)') + '</span>';
                toggle.textContent = _tr('tfa.login.toggle_use_code', 'Use 6-digit code instead');
            } else {
                input.classList.remove('recovery');
                input.setAttribute('maxlength', '8');
                input.setAttribute('placeholder', '000000');
                input.setAttribute('autocomplete', 'one-time-code');
                label.innerHTML = _tr('tfa.login.code_label_main', '6-digit Code') + ' <span style="color:#555;text-transform:none;">' + _tr('tfa.login.code_label_hint', '(leave blank if 2FA isn\'t set up)') + '</span>';
                toggle.textContent = _tr('tfa.challenge.recovery_label', 'Use a recovery code instead');
            }
            input.value = '';
            input.focus();
        }

        document.getElementById('toggleRecovery').addEventListener('click', function(e) {
            e.preventDefault();
            setRecoveryMode(!usingRecovery);
        });

        document.getElementById('code').addEventListener('input', function(e) {
            if (usingRecovery) {
                // Allow letters/digits/dash, uppercase
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 14);
            } else {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
            }
        });

        function onKey(e) { if (e.key === 'Enter') document.getElementById('btnLogin').click(); }
        document.getElementById('username').addEventListener('keypress', onKey);
        document.getElementById('password').addEventListener('keypress', onKey);
        document.getElementById('code').addEventListener('keypress', onKey);

        function startLockoutCountdown(seconds) {
            if (lockoutTimer) clearInterval(lockoutTimer);
            var btn = document.getElementById('btnLogin');
            btn.disabled = true;
            var tick = function() {
                if (seconds <= 0) {
                    clearInterval(lockoutTimer);
                    btn.disabled = false;
                    btn.textContent = _tr('tfa.login.btn_signin', 'Sign In');
                    clearError();
                    return;
                }
                var mm = Math.floor(seconds / 60);
                var ss = seconds % 60;
                btn.textContent = _tr('tfa.login.btn_locked_prefix', 'Locked —') + ' ' + mm + ':' + (ss < 10 ? '0' : '') + ss;
                seconds--;
            };
            tick();
            lockoutTimer = setInterval(tick, 1000);
        }

        document.getElementById('btnLogin').addEventListener('click', function() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var code = document.getElementById('code').value.trim();

            // [v2.5.12] (#82, cpb34) Only the username is required. Jellyfin allows
            // passwordless users (blank password) at the standard login portal, so
            // the 2FA portal must accept a blank password too — the server still
            // enforces the real password policy on AuthenticateByName.
            if (!username) {
                showError(_tr('tfa.login.error_missing_username', 'Enter your username.'));
                return;
            }

            clearError();
            var btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>' + _tr('tfa.login.signing_in', 'Signing in...');

            // Use the same deviceId that Jellyfin Web uses so the session we
            // create in AuthenticateNewSession on the server matches the
            // deviceId this browser will use on subsequent API calls. Without
            // this, server creates a random-id session, browser has a
            // different id, browser's calls get blocked, we loop.
            var deviceId = localStorage.getItem('_deviceId2');
            if (!deviceId) {
                // Generate once, persist. Matches the scheme Jellyfin Web uses.
                deviceId = (crypto.getRandomValues
                    ? Array.from(crypto.getRandomValues(new Uint8Array(16)))
                        .map(function(b){return b.toString(16).padStart(2,'0');}).join('')
                    : String(Date.now()) + Math.random().toString(36).slice(2));
                localStorage.setItem('_deviceId2', deviceId);
            }
            var deviceName = 'Jellyfin Web';
            var headers = {
                'Content-Type': 'application/json',
                'X-Emby-Device-Id': deviceId,
                'X-Emby-Device-Name': deviceName
            };
            // Android WebView may discard cookies on Jellyfin sign-out while
            // preserving origin localStorage. The server-issued random token
            // is bound to this exact deviceId and expires with the configured
            // trusted-device window, so it safely restores trust without TOTP.
            try {
                var trustedDeviceToken = localStorage.getItem('twofactor_device_token');
                if (trustedDeviceToken) headers['X-TwoFactor-Token'] = trustedDeviceToken;
            } catch (e) {}

            fetch(window.tfaUrl('TwoFactorAuth/Authenticate'), {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    username: username,
                    password: password,
                    code: code,
                    trustDevice: document.getElementById('trustDevice').checked
                })
            }).then(function(r) {
                if (r.ok) {
                    var issuedDeviceToken = r.headers.get('X-TwoFactor-Device-Token');
                    if (issuedDeviceToken) {
                        try { localStorage.setItem('twofactor_device_token', issuedDeviceToken); } catch (e) {}
                    }
                    return r.json();
                }
                return r.json().catch(function() { return { message: _tr('tfa.login.error_signin_status', 'Sign in failed') + ' (' + r.status + ').' }; }).then(function(body) {
                    if (body && (body.TwoFactorRequired || body.twoFactorRequired)) {
                        var challengeToken = body.ChallengeToken || body.challengeToken || '';
                        window.location.href = window.tfaUrl('TwoFactorAuth/Challenge?token=' + encodeURIComponent(challengeToken));
                        return null;
                    }
                    btn.disabled = false;
                    btn.textContent = _tr('tfa.login.btn_signin', 'Sign In');
                    if (r.status === 429 && body.lockoutRemainingSeconds) {
                        showError(body.message || _tr('tfa.challenge.locked_out', 'Account locked.'));
                        startLockoutCountdown(body.lockoutRemainingSeconds);
                    } else if (r.status === 429 && body.retryAfterSeconds) {
                        showError(body.message || _tr('tfa.challenge.locked_out', 'Too many attempts.'));
                        startLockoutCountdown(body.retryAfterSeconds);
                    } else {
                        showError(body.message || _tr('tfa.error.unknown', 'Sign in failed.'));
                    }
                    return null;
                });
            }).then(function(authData) {
                if (!authData) return;
                storeCredentials(authData).then(function() {
                    checkLowRecoveryCodes(authData).then(function() {
                        window.location.href = window.tfaUrl('web/index.html');
                    });
                });
            }).catch(function() {
                btn.disabled = false;
                btn.textContent = _tr('tfa.login.btn_signin', 'Sign In');
                showError(_tr('tfa.login.error_network', 'Network error. Check your connection and try again.'));
            });
        });

        function checkLowRecoveryCodes(authData) {
            return fetch(window.tfaUrl('TwoFactorAuth/RecoveryCodes/Status'), {
                headers: { 'X-Emby-Token': authData.AccessToken }
            }).then(function(r) { return r.ok ? r.json() : null; }).then(function(s) {
                if (!s) return;
                if (s.total > 0 && s.remaining < 3) {
                    return new Promise(function(resolve) {
                        var bar = document.createElement('div');
                        bar.style.cssText = 'position:fixed;left:0;right:0;top:0;background:#ff9800;color:#000;padding:14px 18px;font-size:14px;text-align:center;z-index:9999;font-weight:500;';
                        var codeNoun = (s.remaining === 1)
                            ? _tr('tfa.login.recovery_code_singular', 'recovery code')
                            : _tr('tfa.login.recovery_code_plural', 'recovery codes');
                        bar.innerHTML = '⚠ ' + _tr('tfa.login.low_codes_only', 'Only') + ' ' + s.remaining + ' ' + codeNoun + ' ' + _tr('tfa.login.low_codes_left', 'left.') + ' <a href="' + window.tfaUrl('TwoFactorAuth/Setup') + '" style="color:#000;text-decoration:underline;">' + _tr('tfa.login.low_codes_generate', 'Generate more →') + '</a> &nbsp; <button id="dismissBar" style="background:#000;color:#fff;border:none;padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer;">' + _tr('tfa.login.low_codes_continue', 'Continue') + '</button>';
                        document.body.appendChild(bar);
                        document.getElementById('dismissBar').addEventListener('click', function() { resolve(); });
                        setTimeout(resolve, 6000);
                    });
                }
            }).catch(function() { /* best effort */ });
        }

        function storeCredentials(authData) {
            return fetch(window.tfaUrl('System/Info/Public')).then(function(r) { return r.ok ? r.json() : null; }).then(function(info) {
                var serverId = authData.ServerId || (info && info.Id) || '';
                var serverName = (info && info.ServerName) || 'Jellyfin';
                var serverAddress = new URL(window.tfaUrl(''), window.location.origin)
                    .toString().replace(/\/+$/, '');
                var creds;
                try { creds = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}'); } catch (e) { creds = {}; }
                if (!creds.Servers) creds.Servers = [];
                var existing = creds.Servers.find(function(s) { return s.Id === serverId; });
                var now = Date.now();
                if (existing) {
                    existing.AccessToken = authData.AccessToken;
                    existing.UserId = authData.User && authData.User.Id;
                    existing.DateLastAccessed = now;
                    // The address that just completed authentication is the
                    // only one proven reachable. Keeping a stale LAN address
                    // here makes an external reverse-proxy login succeed on
                    // the server, then Jellyfin reconnect internally and
                    // bounce straight back to the login page (#137).
                    existing.ManualAddress = serverAddress;
                    existing.LastConnectionMode = TFA_CONNECTION_MODE_MANUAL;
                    if (!existing.Name) existing.Name = serverName;
                } else {
                    creds.Servers.unshift({
                        Id: serverId,
                        Name: serverName,
                        AccessToken: authData.AccessToken,
                        UserId: authData.User && authData.User.Id,
                        ManualAddress: serverAddress,
                        DateLastAccessed: now,
                        LastConnectionMode: TFA_CONNECTION_MODE_MANUAL
                    });
                }
                localStorage.setItem('jellyfin_credentials', JSON.stringify(creds));
                clearTfaClientState();
            }).catch(function() {/* best effort */});
        }
    </script>
</body>
</html>
