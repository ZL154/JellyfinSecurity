<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Reset your password</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #101317; color: #e6e6e6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
        .card { background: #16181c; border: 1px solid #2a2d33; border-radius: 14px; max-width: 420px; width: 100%;
            padding: 28px; box-sizing: border-box; }
        h1 { font-size: 20px; margin: 0 0 6px; }
        p.sub { color: #aeb4bd; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
        label { display: block; font-size: 13px; color: #aeb4bd; margin: 14px 0 6px; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px;
            border: 1px solid #2a2d33; background: #0e1014; color: #e6e6e6; font-size: 15px; }
        button { width: 100%; margin-top: 18px; padding: 13px; border-radius: 10px; border: 0; background: #00a4dc;
            color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        .msg { margin-top: 16px; font-size: 14px; line-height: 1.5; border-radius: 8px; padding: 12px 14px; display: none; }
        .msg.err { display: block; background: rgba(244,67,54,.14); border: 1px solid rgba(244,67,54,.4); color: #ff8a80; }
        .msg.ok { display: block; background: rgba(76,175,80,.14); border: 1px solid rgba(76,175,80,.4); color: #a5d6a7; }
        a.back { display: inline-block; margin-top: 18px; color: #7d828b; font-size: 13px; text-decoration: none; }
        .hint { font-size: 12px; color: #6b7079; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset your password</h1>
        <p class="sub" id="subtitle">Choose a new password for your Jellyfin account.</p>

        <div id="form">
            <label for="pw1">New password</label>
            <input type="password" id="pw1" autocomplete="new-password" />
            <label for="pw2">Confirm new password</label>
            <input type="password" id="pw2" autocomplete="new-password" />
            <div class="hint">Use at least 4 characters. A longer passphrase is stronger.</div>
            <button id="submit">Set new password</button>
        </div>

        <div class="msg" id="msg"></div>
        <a class="back" href="/web/index.html">&larr; Back to sign in</a>
    </div>

    <script>
        (function () {
            function qp(name) {
                var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search || '');
                return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
            }
            var token = qp('token');
            var form = document.getElementById('form');
            var msg = document.getElementById('msg');
            var sub = document.getElementById('subtitle');
            var btn = document.getElementById('submit');

            function showErr(t) { msg.className = 'msg err'; msg.textContent = t; }
            function showOk(t) { msg.className = 'msg ok'; msg.textContent = t; }
            function hideForm() { form.style.display = 'none'; }

            if (!token) {
                hideForm();
                showErr('This reset link is missing its token. Please use the link from your email.');
                return;
            }

            // Pre-validate so an expired link shows a clean message before typing.
            fetch('/TwoFactorAuth/PasswordReset/Validate?token=' + encodeURIComponent(token), { credentials: 'omit' })
                .then(function (r) { return r.ok ? r.json() : { valid: false }; })
                .then(function (j) {
                    if (!j || !j.valid) {
                        hideForm();
                        showErr('This reset link is invalid or has expired. Please request a new one from the sign-in page.');
                    }
                })
                .catch(function () { /* let the submit attempt surface errors */ });

            btn.addEventListener('click', function () {
                msg.className = 'msg'; msg.textContent = '';
                var p1 = document.getElementById('pw1').value;
                var p2 = document.getElementById('pw2').value;
                if (!p1 || p1.length < 4) { showErr('Please choose a password of at least 4 characters.'); return; }
                if (p1 !== p2) { showErr('The two passwords do not match.'); return; }
                btn.disabled = true;
                fetch('/TwoFactorAuth/PasswordReset/Complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'omit',
                    body: JSON.stringify({ Token: token, NewPassword: p1 })
                }).then(function (r) {
                    return r.json().then(function (j) { return { ok: r.ok, body: j }; });
                }).then(function (res) {
                    if (res.ok) {
                        hideForm();
                        sub.textContent = '';
                        showOk((res.body && res.body.message) || 'Your password has been reset. You can now sign in.');
                    } else {
                        btn.disabled = false;
                        showErr((res.body && res.body.message) || 'Could not reset your password. Please request a new link.');
                    }
                }).catch(function () {
                    btn.disabled = false;
                    showErr('Network error. Please try again.');
                });
            });
        })();
    </script>
</body>
</html>
