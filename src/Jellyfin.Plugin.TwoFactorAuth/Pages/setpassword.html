<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Set your Jellyfin password</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #101317; color: #e6e6e6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
        .card { background: #16181c; border: 1px solid #2a2d33; border-radius: 14px; max-width: 440px; width: 100%;
            padding: 28px; box-sizing: border-box; }
        h1 { font-size: 20px; margin: 0 0 6px; }
        p.sub { color: #aeb4bd; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
        label { display: block; font-size: 13px; color: #aeb4bd; margin: 14px 0 6px; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px;
            border: 1px solid #2a2d33; background: #0e1014; color: #e6e6e6; font-size: 15px; }
        button { width: 100%; margin-top: 18px; padding: 13px; border-radius: 10px; border: 0; background: #00a4dc;
            color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        .msg { margin-top: 16px; font-size: 14px; line-height: 1.5; border-radius: 8px; padding: 12px 14px; display: none; }
        .msg.err { display: block; background: rgba(244,67,54,.14); border: 1px solid rgba(244,67,54,.4); color: #ff8a80; }
        .msg.ok { display: block; background: rgba(76,175,80,.14); border: 1px solid rgba(76,175,80,.4); color: #a5d6a7; }
        ul.rules { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12.5px; color: #6b7079; }
        ul.rules li { margin: 3px 0; }
        ul.rules li.met { color: #a5d6a7; }
        ul.rules li::before { content: "\25CB  "; }
        ul.rules li.met::before { content: "\25CF  "; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set your Jellyfin password</h1>
        <p class="sub">You signed in with your identity provider. Set a local Jellyfin password so you can use apps and
            integrations that ask for it. You'll keep signing in with SSO as normal.</p>

        <div id="form">
            <label for="pw1">New password</label>
            <input type="password" id="pw1" autocomplete="new-password" />
            <label for="pw2">Confirm password</label>
            <input type="password" id="pw2" autocomplete="new-password" />
            <ul class="rules" id="rules"></ul>
            <button id="submit">Set password</button>
        </div>

        <div class="msg" id="msg"></div>
    </div>

    <script>
        (function () {
            var form = document.getElementById('form');
            var msg = document.getElementById('msg');
            var btn = document.getElementById('submit');
            var pw1 = document.getElementById('pw1');
            var pw2 = document.getElementById('pw2');
            var rulesEl = document.getElementById('rules');

            function showErr(t) { msg.className = 'msg err'; msg.textContent = t; }
            function showOk(t) { msg.className = 'msg ok'; msg.textContent = t; }

            // The OIDC bridge stored credentials in localStorage before sending us
            // here, so the session token is available to authorize the change.
            function getToken() {
                try {
                    var creds = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}');
                    var servers = creds.Servers || [];
                    for (var i = 0; i < servers.length; i++) {
                        if (servers[i] && servers[i].AccessToken) return servers[i].AccessToken;
                    }
                } catch (e) {}
                return '';
            }
            var token = getToken();

            function authHeaders() {
                var h = { 'Content-Type': 'application/json' };
                if (token) {
                    h['X-Emby-Token'] = token;
                    h['Authorization'] = 'MediaBrowser Token="' + token + '"';
                    h['X-Emby-Authorization'] = 'MediaBrowser Token="' + token + '"';
                }
                return h;
            }

            var policy = { minLength: 16, requireUppercase: false, requireLowercase: false, requireDigit: false };
            var policyLoaded = false;
            var passwordSet = false;
            // [v2.5.16] (#100, Re4mstr) Until the authoritative policy loads we don't
            // know the real rules, so keep submit disabled — otherwise a failed
            // policy fetch would silently show the built-in default and the user
            // could submit a password the server then rejects against rules they
            // never saw ("it only says 16 regardless of what I set").
            btn.disabled = true;

            function ruleList(p) {
                var r = [{ key: 'len', label: 'At least ' + p.minLength + ' characters' }];
                if (p.requireUppercase) r.push({ key: 'up', label: 'An uppercase letter' });
                if (p.requireLowercase) r.push({ key: 'low', label: 'A lowercase letter' });
                if (p.requireDigit) r.push({ key: 'dig', label: 'A number' });
                return r;
            }
            function evalRule(key, v) {
                if (key === 'len') return v.length >= policy.minLength;
                if (key === 'up') return /[A-Z]/.test(v);
                if (key === 'low') return /[a-z]/.test(v);
                if (key === 'dig') return /[0-9]/.test(v);
                return true;
            }
            function renderRules() {
                var v = pw1.value || '';
                rulesEl.innerHTML = '';
                ruleList(policy).forEach(function (rule) {
                    var li = document.createElement('li');
                    li.textContent = rule.label;
                    if (evalRule(rule.key, v)) li.className = 'met';
                    rulesEl.appendChild(li);
                });
            }
            function allMet() {
                var v = pw1.value || '';
                return ruleList(policy).every(function (rule) { return evalRule(rule.key, v); });
            }

            // Load the configured policy so the on-screen rules match server-side
            // validation (which is authoritative). [v2.5.16] (#100, Re4mstr) If this
            // fails we must NOT silently fall back to the built-in default and let
            // the user submit against rules they never saw; surface the error, keep
            // submit disabled, and offer a refresh. Retry a couple of times first
            // for a transient hiccup (slow proxy, cold start).
            function loadPolicy(attempt) {
                fetch('/TwoFactorAuth/SetPassword/Policy', { headers: authHeaders(), credentials: 'omit' })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function (j) {
                        policy = j; policyLoaded = true;
                        msg.className = 'msg'; msg.textContent = '';
                        btn.disabled = false;
                        renderRules();
                    })
                    .catch(function () {
                        if ((attempt || 0) < 2) { setTimeout(function () { loadPolicy((attempt || 0) + 1); }, 1200); return; }
                        btn.disabled = true;
                        // [v2.5.16] (#100) CRITICAL: do not hard-lock the user. The
                        // inject.js enforcement bounces them back here from /web, so
                        // if the policy can't load AND submit is disabled they'd be
                        // trapped with no way into Jellyfin. Offer an escape to the
                        // app; the server-side MustSetPassword flag persists, so they
                        // are re-prompted on their next OIDC sign-in.
                        msg.className = 'msg err'; msg.textContent = '';
                        var line = document.createElement('div');
                        line.textContent = 'Could not load the password requirements (your session may have expired, or a reverse proxy is blocking it). Refresh to try again, or:';
                        msg.appendChild(line);
                        var esc = document.createElement('a');
                        esc.href = '#'; esc.textContent = 'Continue to Jellyfin for now';
                        esc.style.cssText = 'display:inline-block;margin-top:8px;color:#00a4dc;text-decoration:none;';
                        esc.addEventListener('click', function (ev) { ev.preventDefault(); passwordSet = true; clearRequiredFlag(); window.location.href = '/web/index.html'; });
                        msg.appendChild(esc);
                    });
            }
            loadPolicy(0);

            pw1.addEventListener('input', renderRules);

            function clearRequiredFlag() { try { localStorage.removeItem('__tfa_set_pw_required'); } catch (e) {} }
            function goToApp() { passwordSet = true; clearRequiredFlag(); form.style.display = 'none'; setTimeout(function () { window.location.href = '/web/index.html'; }, 800); }

            btn.addEventListener('click', function () {
                msg.className = 'msg'; msg.textContent = '';
                if (!token) { showErr('Your session was not found. Please sign in again.'); return; }
                if (!policyLoaded) { showErr('Password requirements have not loaded yet. Please refresh and try again.'); return; }
                if (!allMet()) { showErr('Your password does not meet all the requirements below.'); return; }
                if (pw1.value !== pw2.value) { showErr('The two passwords do not match.'); return; }
                btn.disabled = true;
                fetch('/TwoFactorAuth/SetPassword', {
                    method: 'POST',
                    headers: authHeaders(),
                    credentials: 'omit',
                    body: JSON.stringify({ Password: pw1.value })
                }).then(function (r) {
                    return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
                }).then(function (res) {
                    if (res.ok) {
                        showOk('Password set. Redirecting…');
                        goToApp();
                    } else if (res.status === 400 && res.body && /no password setup is pending/i.test(res.body.message || '')) {
                        // [v2.5.16] (#100) Stale flag — a password was already set
                        // (e.g. on another device). Clear the marker and let them in
                        // instead of trapping them on this page.
                        showOk('Your password is already set. Redirecting…');
                        goToApp();
                    } else {
                        btn.disabled = false;
                        showErr((res.body && res.body.message) || 'Could not set your password. Please try again.');
                    }
                }).catch(function () {
                    btn.disabled = false;
                    showErr('Network error. Please try again.');
                });
            });

            // [v2.5.16] (#100, Re4mstr) Warn before leaving without setting the
            // password (only when the forced flag is set, so voluntary visitors
            // aren't nagged). Combined with inject.js's /web enforcement, this makes
            // the forced step hard to skip by accident.
            window.addEventListener('beforeunload', function (e) {
                if (passwordSet) return;
                try { if (localStorage.getItem('__tfa_set_pw_required') !== '1') return; } catch (ex) { return; }
                e.preventDefault(); e.returnValue = '';
            });
        })();
    </script>
</body>
</html>
